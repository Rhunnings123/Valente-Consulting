<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Valente Consulting</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12110F; --ink-soft:#2b2823; --paper:#F7F4EC;
    --brass:#C99A1E; --gold:#EEC23C; --gold-deep:#C99A1E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink-soft);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .wrap{max-width:480px;}
  .code{font-family:'Anton',sans-serif;font-size:clamp(60px,12vw,110px);color:var(--gold);line-height:1;text-transform:uppercase;}
  h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,4vw,30px);color:var(--ink);margin-top:8px;}
  p{margin-top:16px;font-size:15px;line-height:1.6;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:32px;
    background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;
    text-transform:uppercase;letter-spacing:0.04em;text-decoration:none;
    padding:15px 28px;border:1px solid var(--gold);
  }
  .btn:hover{background:transparent;color:var(--gold-deep);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This Page Doesn't Exist</h1>
    <p>The page you're looking for has moved, or the link might be out of date. Let's get you back to building an asset instead.</p>
    <a class="btn" href="/">&larr; Back to Home</a>
  </div>
</body>
</html>
